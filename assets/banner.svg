<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#181336" />
    </linearGradient>

    <!-- Glowing Accent Gradient with Animation -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Classic, Universal Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.75" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.2" fill="#475569" opacity="0.4" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Background Animated Atmospheric Glow Orbs -->
  <circle cx="180" cy="180" r="150" fill="#0284c7" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="r" values="130;170;130" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="140" r="170" fill="#7c3aed" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="r" values="150;190;150" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Ambient Decorative Signing Wave (Animated Stroke) -->
  <g opacity="0.45" filter="url(#softGlow)">
    <path d="M 100 290 Q 220 220, 340 270 T 560 250 T 780 290 T 960 230 T 1100 260"
          fill="none" stroke="url(#glowGradient)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" values="1400;0;1400" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M 240 305 Q 440 335, 680 295 T 980 315"
          fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"
          stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" values="700;0;700" dur="9s" begin="1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Dynamic Pills (Positioned at corners/edges away from center text) -->
  <g class="font-sans">
    <!-- Top-Right Pill: eIDAS & ESIGN -->
    <g transform="translate(910, 42)">
      <animateTransform attributeName="transform" type="translate" values="910,42; 910,36; 910,42" dur="4.2s" repeatCount="indefinite" />
      <rect width="180" height="32" rx="16" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#bae6fd" font-size="12.5" font-weight="600">eIDAS &amp; ESIGN Legal</text>
    </g>

    <!-- Top-Left Pill: RFC 3161 Timestamps -->
    <g transform="translate(100, 48)">
      <animateTransform attributeName="transform" type="translate" values="100,48; 100,54; 100,48" dur="5s" repeatCount="indefinite" />
      <rect width="200" height="32" rx="16" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#a855f7">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#e9d5ff" font-size="12.5" font-weight="600">RFC 3161 PAdES / XAdES</text>
    </g>

    <!-- Bottom-Left Pill: Self-Hosted & Sovereign -->
    <g transform="translate(90, 286)">
      <animateTransform attributeName="transform" type="translate" values="90,286; 90,280; 90,286" dur="4.6s" repeatCount="indefinite" />
      <rect width="190" height="32" rx="16" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#a7f3d0" font-size="12.5" font-weight="600">Self-Hosted &amp; Sovereign</text>
    </g>

    <!-- Bottom-Right Pill: Open-Source & SaaS -->
    <g transform="translate(930, 284)">
      <animateTransform attributeName="transform" type="translate" values="930,284; 930,290; 930,284" dur="5.2s" repeatCount="indefinite" />
      <rect width="180" height="32" rx="16" fill="url(#cardBg)" stroke="#fb7185" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#fb7185">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#fecdd3" font-size="12.5" font-weight="600">Open-Source &amp; SaaS</text>
    </g>
  </g>

  <!-- FOREGROUND HERO CONTENT (High contrast, guaranteed on top) -->
  <g class="font-sans" text-anchor="middle">
    <!-- Top Eyebrow Badge -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="-116" cy="0" r="3.5" fill="#818cf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="4.5" fill="#c7d2fe" font-size="11" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <g filter="url(#dropShadow)">
      <text x="600" y="150" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-1">
        Awesome <tspan fill="#38bdf8">Electronic</tspan> <tspan fill="#818cf8">Signature</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g filter="url(#dropShadow)">
      <text x="600" y="196" fill="#cbd5e1" font-size="17" font-weight="500" letter-spacing="0.2">
        Digital Document Signing, Cryptographic Verification &amp; Workflow Automation
      </text>
    </g>

    <!-- Feature Highlights Bar (Center Foreground) -->
    <g transform="translate(600, 246)" filter="url(#dropShadow)">
      <rect x="-350" y="-18" width="700" height="36" rx="18" fill="#090e1c" stroke="#334155" stroke-width="1.2" />
      
      <!-- DocuSign Alternatives -->
      <g transform="translate(-250, 5)">
        <circle cx="-10" cy="-4" r="3" fill="#38bdf8" />
        <text x="0" y="0" fill="#f1f5f9" font-size="13" font-weight="600">DocuSign Alternatives</text>
      </g>
      
      <circle cx="-135" cy="0" r="2" fill="#475569" />

      <!-- PKI & Audit Trails -->
      <g transform="translate(-55, 5)">
        <circle cx="-10" cy="-4" r="3" fill="#818cf8" />
        <text x="0" y="0" fill="#f1f5f9" font-size="13" font-weight="600">PKI &amp; Audit Trails</text>
      </g>

      <circle cx="45" cy="0" r="2" fill="#475569" />

      <!-- PDF Cryptography -->
      <g transform="translate(130, 5)">
        <circle cx="-10" cy="-4" r="3" fill="#a855f7" />
        <text x="0" y="0" fill="#f1f5f9" font-size="13" font-weight="600">PDF Cryptography</text>
      </g>

      <circle cx="215" cy="0" r="2" fill="#475569" />

      <!-- E-Sign APIs -->
      <g transform="translate(280, 5)">
        <circle cx="-10" cy="-4" r="3" fill="#34d399" />
        <text x="0" y="0" fill="#f1f5f9" font-size="13" font-weight="600">E-Sign APIs</text>
      </g>
    </g>
  </g>
</svg>
